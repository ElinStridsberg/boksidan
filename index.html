<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Boksidan</title>
</head>

<body>
    <header>
        <img src="./images/logo.png" alt="Logga" class="logo">
        <nav>
            <ul>
                <li>
                    <a href="#start">Start</a>
                </li>
                <li>
                    <a href="#boken">Boken</a>
                </li>
                <li><a href="#författaren">Författaren</a></li>
                <li><a href="#innehåll">Innehåll</a></li>
                <li><a href="#köpnu">Köp nu</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <img src="./images/hero.png" alt="Hero" class="heroimage">

            <div class="herocontent">
                <h1>Rubrik</h1>
                <p>Blablabla</p>
                <a href="#köpnu" class="cta-button">Köp nu</a>
            </div>
        </section>

        <section class="book-author">
            <div class="info-block" id="boken">
                <img src="./images/book.png" alt="Bok" class="info-image">

                <div class="info-text">
                    <h2>Rubrik om boken</h2>
                    <p>Text om boken</p>
                </div>
            </div>

            <div class="info-block" id="författaren">
                <img src="./images/author.png" alt="Författaren" class="info-image">

                <div class="info-text">
                    <h2>Rubrik om författaren</h2>
                    <p>Text om författaren</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
